// Debounce hook - delays expensive recalculations
function useDebounce(value,delay=300){
  const [debounced,setDebounced]=useState(value);
  useEffect(()=>{
    const t=setTimeout(()=>setDebounced(value),delay);
    return()=>clearTimeout(t);
  },[value,delay]);
  return debounced;
}

// Lazy render - only renders chart when scrolled into view
function LazyChart({children,height=300}){
  const [visible,setVisible]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting){setVisible(true);obs.disconnect();}
    },{rootMargin:'200px'});
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);
  return(
    <div ref={ref} style={{minHeight:height}}>
      {visible?children:(
        <div className="flex items-center justify-center h-full text-gray-400 dark:text-gray-600 text-sm" style={{height}}>
          <svg className="w-5 h-5 spinner mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Cargando...
        </div>
      )}
    </div>
  );
}

function sampleData(data,maxPoints=500){

}

// ===================== UTILITIES =====================
function norm(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}

function parseMoney(v){
  if(typeof v==='number') return v;
  if(!v) return 0;
  let s=v.toString().replace(/[$,\s]/g,'');
  let n=parseFloat(s);
  return isNaN(n)?0:n;
}

function fmt$(n){
  if(n==null||isNaN(n)) return '$0';
  return '$'+n.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function fmt$d(n){
  if(n==null||isNaN(n)) return '$0.00';
  return '$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function fmtN(n,d=1){
  if(n==null||isNaN(n)) return '0';
  return n.toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d});
}

function fmtPct(n){return(n*100).toFixed(1)+'%';}

function parseDate(v){
  if(!v) return null;
  if(v instanceof Date) return v;
  let s=v.toString().trim();
  // DD/MM/YYYY HH:MM or DD/MM/YYYY
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
  // YYYY-MM-DD
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
  let d=new Date(s);
  return isNaN(d.getTime())?null:d;
}

function fmtDate(d){
  if(!d) return '';
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'});
}

// Normalize a raw row (from CSV or JSON) to internal format
function normalizeRow(raw){
  let r={};
  // Map columns
  for(let [key,val] of Object.entries(raw)){
    let nk=norm(key);
    // Try direct mapping
    let mapped=COL_MAP[nk];
    if(mapped){r[mapped]=val;continue;}
    // Try partial match
    for(let [pat,mk] of Object.entries(COL_MAP)){
      if(nk.includes(pat)||pat.includes(nk)){r[mk]=val;break;}
    }
  }
  // Handle data.json snake_case format (from actualizar_datos.py)
  if(raw.razon_reparacion!==undefined) r.razonReparacion=raw.razon_reparacion;
  if(raw.precio_refaccion!==undefined) r.precioRefaccion=raw.precio_refaccion;
  if(raw.precio_mano_obra!==undefined) r.precioManoObra=raw.precio_mano_obra;
  if(raw.precio_otros!==undefined) r.precioOtros=raw.precio_otros;
  if(raw.tipo_equipo!==undefined) r.tipoEquipo=raw.tipo_equipo;
  if(raw.tipo_servicio!==undefined) r.tipoServicio=raw.tipo_servicio;
  if(raw.dias_real!==undefined) r.diasReal=raw.dias_real;
  if(raw.dias_atraso!==undefined) r.diasAtraso=raw.dias_atraso;
  if(raw.dias_promedio!==undefined) r.diasPromedio=raw.dias_promedio;
  if(raw.nodo!==undefined&&!r.tallerOrden) r.tallerOrden=raw.nodo;
  if(raw.taller_orden!==undefined) r.tallerOrden=raw.taller_orden;
  if(raw.zona_cliente!==undefined) r.zonaCliente=raw.zona_cliente;
  if(raw.fecha_ingreso!==undefined) r.fechaIngreso=raw.fecha_ingreso;
  if(raw.fecha_terminacion!==undefined) r.fechaTerminacion=raw.fecha_terminacion;
  if(raw.grupo_manto!==undefined) r.grupoManto=raw.grupo_manto;
  if(raw.tiempo_estandar!==undefined) r.tiempoEstandar=raw.tiempo_estandar;
  if(raw.atendido_a_tiempo!==undefined) r.atendidoATiempo=raw.atendido_a_tiempo;
  if(raw.kms_acumulados!==undefined) r.kmsAcumulados=raw.kms_acumulados;
  if(raw.orden!==undefined&&!r.orden) r.orden=raw.orden;
  if(raw.cliente!==undefined&&!r.cliente) r.cliente=raw.cliente;
  if(raw.operador!==undefined&&!r.operador) r.operador=raw.operador;
  if(raw.solicitante!==undefined&&!r.solicitante) r.solicitante=raw.solicitante;
  if(raw.serie!==undefined&&!r.serie) r.serie=raw.serie;
  if(raw.equipo!==undefined&&!r.equipo) r.equipo=raw.equipo;
  if(raw.marca!==undefined&&!r.marca) r.marca=raw.marca;
  if(raw.modelo!==undefined&&!r.modelo) r.modelo=raw.modelo;
  if(raw.clasificacion!==undefined&&!r.clasificacion) r.clasificacion=raw.clasificacion;
  if(raw.region!==undefined&&!r.region) r.region=raw.region;
  if(raw.familia!==undefined&&!r.familia) r.familia=raw.familia;

  // Parse numeric fields
  r.precioRefaccion=parseMoney(r.precioRefaccion);
  r.precioManoObra=parseMoney(r.precioManoObra);
  r.precioOtros=parseMoney(r.precioOtros);
  r.total=parseMoney(r.total);
  r.diasReal=parseFloat(r.diasReal)||0;
  r.diasAtraso=parseFloat(r.diasAtraso)||0;
  r.diasPromedio=parseFloat(r.diasPromedio)||0;
  r.kmsAcumulados=parseFloat((r.kmsAcumulados||'').toString().replace(/,/g,''))||0;
  r.tiempoEstandar=parseFloat(r.tiempoEstandar)||0;

  // Parse dates
  r.fechaIngreso=parseDate(r.fechaIngreso);
  r.fechaTerminacion=parseDate(r.fechaTerminacion);

  // String fields
  r.equipo=(r.equipo||'').toString().trim();
  r.orden=(r.orden||'').toString().trim();
  r.marca=(r.marca||'').toString().trim();
  r.modelo=(r.modelo||'').toString().trim();
  r.tipoEquipo=(r.tipoEquipo||'').toString().trim();
  r.clasificacion=(r.clasificacion||'').toString().trim();
  r.tipoServicio=(r.tipoServicio||'').toString().trim();
  r.razonReparacion=(r.razonReparacion||'').toString().trim();
  r.tallerOrden=(r.tallerOrden||'').toString().trim();
  r.region=(r.region||'').toString().trim();
  r.zonaCliente=(r.zonaCliente||r.region||'').toString().trim();
  r.cliente=(r.cliente||'').toString().trim();
  r.operador=(r.operador||'').toString().trim();
  r.solicitante=(r.solicitante||'').toString().trim();
  r.atendidoATiempo=(r.atendidoATiempo||'').toString().trim().toUpperCase();
  r.serie=(r.serie||'').toString().trim();
  r.anoEquipo=(r.anoEquipo||'').toString().trim();
  r.mes=(r.mes||'').toString().trim();
  r.ano=(r.ano||'').toString().trim();

  // Derive mes/ano from fechaTerminacion if missing
  if(!r.mes&&r.fechaTerminacion){
    const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    r.mes=meses[r.fechaTerminacion.getMonth()];
  }
  if(!r.ano&&r.fechaTerminacion) r.ano=r.fechaTerminacion.getFullYear().toString();

  return r;
}

function unique(arr,key){
  let s=new Set();
  arr.forEach(r=>{let v=r[key];if(v)s.add(v);});
  return [...s].sort();
}

function groupBy(arr,key){
  let m={};
  arr.forEach(r=>{let k=r[key]||'Sin datos';if(!m[k])m[k]=[];m[k].push(r);});
  return m;
}

function sumBy(arr,key){return arr.reduce((s,r)=>s+(r[key]||0),0);}
function avgBy(arr,key){return arr.length?sumBy(arr,key)/arr.length:0;}

// ===================== MULTISELECT COMPONENT =====================
function MultiSelect({label,options,selected,onChange}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    function close(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener('mousedown',close);
    return()=>document.removeEventListener('mousedown',close);
  },[]);
  const toggle=(v)=>{
    if(selected.includes(v)) onChange(selected.filter(x=>x!==v));
    else onChange([...selected,v]);
  };
  const count=selected.length;
  return(
    <div ref={ref} className="relative">
      <button onClick={()=>setOpen(!open)}
        className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium border transition-all
          ${count>0
            ?'bg-primary text-white border-primary dark:bg-blue-600 dark:border-blue-600'
            :'bg-white dark:bg-gray-800 border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:border-primary dark:hover:border-blue-500'}`}>
        <span>{label}</span>
        {count>0&&<span className="bg-white/20 px-1.5 rounded-full text-[10px]">{count}</span>}
        <Icons.chevDown/>
      </button>
      {open&&(
        <div className="absolute top-full mt-1 left-0 z-50 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-xl min-w-[200px] dropdown-menu">
          {options.map(o=>(

// ===================== UPLOAD SCREEN =====================
function UploadScreen({onDataLoad}){
  const [dragging,setDragging]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const inputRef=useRef(null);

  const processFile=(file)=>{
    setLoading(true);setError('');
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext==='csv'||ext==='txt'){
      Papa.parse(file,{
        header:true,
        encoding:'ISO-8859-1',
        skipEmptyLines:true,
        complete:(res)=>{
          if(res.errors.length>5){setError('Demasiados errores en el CSV');setLoading(false);return;}
          const data=res.data.map(normalizeRow).filter(r=>r.equipo||r.orden);
          if(data.length===0){setError('No se encontraron registros válidos');setLoading(false);return;}
          onDataLoad(data,file.name);
        },
        error:(err)=>{setError('Error leyendo CSV: '+err.message);setLoading(false);}
      });
    } else if(ext==='xlsx'||ext==='xls'){
      const reader=new FileReader();
      reader.onload=(e)=>{
        try{
          const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
          // Try 'bd' sheet first, then first sheet
          const sn=wb.SheetNames.includes('bd')?'bd':wb.SheetNames[0];
          const ws=wb.Sheets[sn];
          const raw=XLSX.utils.sheet_to_json(ws,{defval:''});
          const data=raw.map(normalizeRow).filter(r=>r.equipo||r.orden);
          if(data.length===0){setError('No se encontraron registros válidos');setLoading(false);return;}
          onDataLoad(data,file.name);
        }catch(err){setError('Error leyendo Excel: '+err.message);setLoading(false);}
      };
      reader.readAsArrayBuffer(file);
    } else {
      setError('Formato no soportado. Usa CSV o Excel (.xlsx)');
      setLoading(false);
    }
  };

  const loadLiveData=async()=>{
    setLoading(true);setError('');
    try{
      const res=await fetch('https://uhernandez2497-source.github.io/dashboard-flota/data.json');
      if(!res.ok) throw new Error('HTTP '+res.status);
      const json=await res.json();
      const data=(json.data||[]).map(normalizeRow).filter(r=>r.equipo);
      if(data.length===0) throw new Error('Sin datos');
      onDataLoad(data,'data.json (en vivo) - '+json.count+' registros - Actualizado: '+(json.updated||'').substring(0,16));
    }catch(err){setError('Error cargando datos en vivo: '+err.message);setLoading(false);}
  };

  return(
    <div className="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 flex items-center justify-center p-4">
      <div className="max-w-lg w-full">
        <div className="text-center mb-8">
          <h1 className="text-3xl font-bold text-white mb-2">Dashboard de Flota</h1>
          <p className="text-gray-400">Análisis de Órdenes de Gasto Vehicular</p>
        </div>

        <div className={`border-2 border-dashed rounded-2xl p-8 text-center transition-all ${dragging?'border-blue-400 bg-blue-500/10':'border-gray-600 hover:border-gray-500'}`}
          onDragOver={(e)=>{e.preventDefault();setDragging(true);}}
          onDragLeave={()=>setDragging(false)}
          onDrop={(e)=>{e.preventDefault();setDragging(false);if(e.dataTransfer.files[0])processFile(e.dataTransfer.files[0]);}}>

          {loading?(
            <div className="py-4">
              <div className="w-12 h-12 border-3 border-gray-600 border-t-blue-500 rounded-full spinner mx-auto mb-3" style={{borderWidth:3}}></div>
              <p className="text-gray-400 text-sm">Procesando archivo...</p>
            </div>
          ):(
            <>
              <div className="text-blue-400 mb-4 flex justify-center"><Icons.upload/></div>
              <p className="text-white font-medium mb-1">Arrastra tu archivo aquí</p>
              <p className="text-gray-400 text-sm mb-4">CSV o Excel (.xlsx) con los datos de órdenes</p>
              <button onClick={()=>inputRef.current.click()}
                className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition-colors">
                Seleccionar Archivo
              </button>
              <input ref={inputRef} type="file" accept=".csv,.xlsx,.xls" className="hidden"
                onChange={(e)=>{if(e.target.files[0])processFile(e.target.files[0]);}}/>
            </>
          )}
        </div>

        {error&&<div className="mt-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm text-center">{error}</div>}

        <div className="mt-6 text-center">
          <p className="text-gray-500 text-xs mb-3">— o —</p>
          <button onClick={loadLiveData} disabled={loading}
            className="text-blue-400 hover:text-blue-300 text-sm font-medium transition-colors disabled:opacity-50">
            Cargar datos en vivo desde GitHub Pages
          </button>
        </div>

        <div className="mt-8 text-center text-gray-600 text-xs">
          <p>Soporta archivos con columnas: Orden, Fecha Ingreso, Taller Orden,</p>
          <p>Marca, Total, Clasificación, Tipo de Servicio, etc.</p>
        </div>
      </div>
    </div>
  );
}

// ===================== ALERTS PANEL =====================
function AlertsPanel({data}){
  const [open,setOpen]=useState(true);

  const alerts=useMemo(()=>{
    let a=[];
    // Orders with > 10 days delay
    const delayed=data.filter(r=>r.diasAtraso>10).sort((a,b)=>b.diasAtraso-a.diasAtraso).slice(0,5);
    if(delayed.length>0) a.push({type:'danger',title:`${delayed.length} órdenes con atraso > 10 días`,
      detail:delayed.map(r=>`${r.equipo||r.orden}: ${fmtN(r.diasAtraso)} días`).join(' | ')});

    // Talleres with 0% on time
    const byTaller=groupBy(data,'tallerOrden');
    const badTalleres=Object.entries(byTaller).filter(([k,v])=>{
      const onTime=v.filter(r=>r.atendidoATiempo==='SI').length;
      return v.length>=3&&onTime===0;
    }).map(([k])=>k);
    if(badTalleres.length>0) a.push({type:'warning',title:`${badTalleres.length} talleres con 0% atendido a tiempo`,
      detail:badTalleres.join(', ')});

    // Orders > $100,000
    const expensive=data.filter(r=>r.total>100000).sort((a,b)=>b.total-a.total).slice(0,3);
    if(expensive.length>0) a.push({type:'danger',title:`${expensive.length} órdenes con gasto > $100,000`,
      detail:expensive.map(r=>`${r.equipo||r.orden}: ${fmt$(r.total)}`).join(' | ')});

    // Correctivo > 60% of total spend
    const totalSpend=sumBy(data,'total');
    const correctivoSpend=sumBy(data.filter(r=>norm(r.clasificacion).includes('correctiv')),'total');
    if(totalSpend>0&&correctivoSpend/totalSpend>0.6) a.push({type:'warning',
      title:`Correctivo representa ${(correctivoSpend/totalSpend*100).toFixed(1)}% del gasto total`,
      detail:`Correctivo: ${fmt$(correctivoSpend)} de ${fmt$(totalSpend)}`});

    return a;
  },[data]);

  if(alerts.length===0) return null;

  return(
    <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden fade-in">
      <button onClick={()=>setOpen(!open)} className="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors">
        <div className="flex items-center gap-2">
          <span className="text-red-500"><Icons.alert/></span>
          <span className="text-sm font-semibold text-gray-800 dark:text-gray-200">Alertas ({alerts.length})</span>
        </div>
        <span className={`transform transition-transform ${open?'rotate-180':''}`}><Icons.chevDown/></span>
      </button>
      {open&&(
        <div className="px-4 pb-3 space-y-2">
          {alerts.map((a,i)=>(
            <div key={i} className={`p-3 rounded-lg text-xs ${a.type==='danger'?'bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800':'bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800'}`}>
              <p className={`font-semibold ${a.type==='danger'?'text-red-700 dark:text-red-400':'text-yellow-700 dark:text-yellow-400'}`}>{a.title}</p>
              <p className={`mt-0.5 ${a.type==='danger'?'text-red-600 dark:text-red-300':'text-yellow-600 dark:text-yellow-300'}`}>{a.detail}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ===================== KPI SECTION =====================
function KPISection({data}){
  const stats=useMemo(()=>{
    const n=data.length;
    const totalGasto=sumBy(data,'total');
    const avgGasto=n?totalGasto/n:0;
    const siCount=data.filter(r=>r.atendidoATiempo==='SI').length;
    const noCount=data.filter(r=>r.atendidoATiempo==='NO').length;
    const hasATiempo=siCount+noCount>0;
    const pctATiempo=hasATiempo?siCount/(siCount+noCount):null;
    const avgAtraso=avgBy(data,'diasAtraso');
    const correctivo=data.filter(r=>norm(r.clasificacion).includes('correctiv')).length;
    const preventivo=data.filter(r=>norm(r.clasificacion).includes('preventiv')).length;
    const pctCorr=n?(correctivo/n):0;
    return{n,totalGasto,avgGasto,pctATiempo,hasATiempo,avgAtraso,correctivo,preventivo,pctCorr};
  },[data]);

  return(
    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 fade-in">
      <KPICard title="Total Órdenes" value={stats.n.toLocaleString('es-MX')} icon={Icons.orders}/>
      <KPICard title="Gasto Total" value={fmt$(stats.totalGasto)} subtitle={`${fmt$d(stats.avgGasto)} promedio`} icon={Icons.money}/>
      <KPICard title="Gasto Promedio" value={fmt$(stats.avgGasto)} icon={Icons.avg}/>
      <KPICard title="Atendido a Tiempo" value={stats.hasATiempo?fmtPct(stats.pctATiempo):'N/D'}
        subtitle={stats.hasATiempo?`${stats.n-Math.round(stats.pctATiempo*(data.filter(r=>r.atendidoATiempo==='SI').length+data.filter(r=>r.atendidoATiempo==='NO').length))} fuera de tiempo`:null}
        icon={Icons.check} isAlert={stats.hasATiempo&&stats.pctATiempo<0.8}/>
      <KPICard title="Prom. Días Atraso" value={fmtN(stats.avgAtraso)} subtitle={stats.avgAtraso>1?'Supera 1 día':null}
        icon={Icons.clock} isAlert={stats.avgAtraso>1}/>
      <KPICard title="Correctivo vs Preventivo" value={`${stats.correctivo} / ${stats.preventivo}`}
        subtitle={`${(stats.pctCorr*100).toFixed(0)}% correctivo`} icon={Icons.wrench}/>
    </div>
  );
}

// ===================== SECTION 6: DETAIL TABLE =====================
function DetailTable({data}){
  const [page,setPage]=useState(0);
  const [search,setSearch]=useState('');
  const [sortKey,setSortKey]=useState(null);
  const [sortDir,setSortDir]=useState(-1);
  const perPage=20;

  const filtered=useMemo(()=>{
    let d=data;
    if(search){
      const s=search.toLowerCase();
      d=d.filter(r=>(r.orden||'').toLowerCase().includes(s)||(r.equipo||'').toLowerCase().includes(s)||
        (r.cliente||'').toLowerCase().includes(s)||(r.operador||'').toLowerCase().includes(s));
    }
    if(sortKey){
      d=[...d].sort((a,b)=>{
        let va=a[sortKey],vb=b[sortKey];
        if(typeof va==='number'&&typeof vb==='number') return(va-vb)*sortDir;
        return((va||'').toString().localeCompare((vb||'').toString()))*sortDir;
      });
    }
    return d;
  },[data,search,sortKey,sortDir]);

  const totalPages=Math.ceil(filtered.length/perPage);
  const pageData=filtered.slice(page*perPage,(page+1)*perPage);

  const toggleSort=(k)=>{
    if(sortKey===k) setSortDir(d=>d*-1);
    else{setSortKey(k);setSortDir(-1);}
    setPage(0);
  };

  const exportCSV=()=>{
    const headers=['Orden','Fecha Ingreso','Taller Orden','Region','Cliente','Marca','Tipo Servicio','Clasificacion','Total','Dias Real','Dias Atraso','Atendido a Tiempo'];
    const keys=['orden','fechaIngreso','tallerOrden','region','cliente','marca','tipoServicio','clasificacion','total','diasReal','diasAtraso','atendidoATiempo'];
    let csv=headers.join(',')+'\n';
    filtered.forEach(r=>{
      csv+=keys.map(k=>{
        let v=r[k];
        if(v instanceof Date) v=fmtDate(v);
        if(typeof v==='string'&&v.includes(',')) v='"'+v+'"';
        return v??'';
      }).join(',')+'\n';
    });
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='ordenes_filtradas.csv';a.click();
    URL.revokeObjectURL(url);
  };

  const cols=[
    {key:'orden',label:'Orden',w:'w-24'},
    {key:'fechaIngreso',label:'Fecha Ingreso',w:'w-28',fmt:v=>v?fmtDate(v):''},
    {key:'tallerOrden',label:'Taller',w:'w-28'},
    {key:'region',label:'Región',w:'w-28'},
    {key:'cliente',label:'Cliente',w:'w-32'},
    {key:'marca',label:'Marca',w:'w-24'},
    {key:'tipoServicio',label:'Tipo Servicio',w:'w-32'},
    {key:'clasificacion',label:'Clasificación',w:'w-28'},
    {key:'total',label:'Total',w:'w-28',fmt:v=>fmt$(v)},
    {key:'diasReal',label:'Días Real',w:'w-20',fmt:v=>fmtN(v)},
    {key:'diasAtraso',label:'Días Atraso',w:'w-20',fmt:v=>fmtN(v)},
    {key:'atendidoATiempo',label:'A Tiempo',w:'w-20'},
  ];

  return(
    <Card title="" full>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h3 className="text-sm font-semibold text-gray-700 dark:text-gray-300">Tabla de Detalle ({filtered.length} registros)</h3>
        <div className="flex items-center gap-2">
          <div className="relative">
            <span className="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400"><Icons.search/></span>
            <input value={search} onChange={e=>{setSearch(e.target.value);setPage(0);}}
              placeholder="Buscar orden, equipo, cliente..."
              className="pl-8 pr-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-xs w-56 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <button onClick={exportCSV} className="flex items-center gap-1 px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs font-medium transition-colors">
            <Icons.download/> Exportar CSV
          </button>
        </div>
      </div>

      <div className="overflow-x-auto">
        <table className="w-full text-xs">
          <thead>
            <tr className="border-b-2 border-gray-200 dark:border-gray-700">
              {cols.map(c=>(
                <th key={c.key} onClick={()=>toggleSort(c.key)}
                  className={`text-left py-2 px-2 font-semibold text-gray-600 dark:text-gray-400 cursor-pointer hover:text-gray-800 dark:hover:text-gray-200 ${c.w} whitespace-nowrap`}>
                  {c.label} {sortKey===c.key&&(sortDir>0?'↑':'↓')}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {pageData.map((r,i)=>{
              const isNo=r.atendidoATiempo==='NO';
              const isDelay=r.diasAtraso>5;
              return(
                <tr key={i} className={`border-b border-gray-100 dark:border-gray-700/50 transition-colors
                  ${isNo?'bg-red-50 dark:bg-red-900/10':isDelay?'bg-yellow-50 dark:bg-yellow-900/10':'hover:bg-gray-50 dark:hover:bg-gray-750'}`}>
                  {cols.map(c=>(
                    <td key={c.key} className="py-1.5 px-2 truncate max-w-[200px]">
                      {c.fmt?c.fmt(r[c.key]):(r[c.key]||'')}
                    </td>
                  ))}
                </tr>
              );
            })}
            {pageData.length===0&&(
              <tr><td colSpan={cols.length} className="py-8 text-center text-gray-400">No se encontraron registros</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {totalPages>1&&(
        <div className="flex items-center justify-between mt-3 text-xs text-gray-500">
          <span>Página {page+1} de {totalPages}</span>
          <div className="flex gap-1">
            <button disabled={page===0} onClick={()=>setPage(0)}
              className="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 disabled:opacity-30 hover:bg-gray-100 dark:hover:bg-gray-700">«</button>
            <button disabled={page===0} onClick={()=>setPage(p=>p-1)}
              className="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 disabled:opacity-30 hover:bg-gray-100 dark:hover:bg-gray-700">‹</button>
            {[...Array(Math.min(totalPages,7))].map((_,i)=>{
              let p;
              if(totalPages<=7) p=i;
              else if(page<3) p=i;
              else if(page>totalPages-4) p=totalPages-7+i;
              else p=page-3+i;
              return(
                <button key={p} onClick={()=>setPage(p)}
                  className={`px-2 py-1 rounded border ${p===page?'bg-blue-600 text-white border-blue-600':'border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700'}`}>
                  {p+1}
                </button>
              );
            })}
            <button disabled={page>=totalPages-1} onClick={()=>setPage(p=>p+1)}
              className="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 disabled:opacity-30 hover:bg-gray-100 dark:hover:bg-gray-700">›</button>
            <button disabled={page>=totalPages-1} onClick={()=>setPage(totalPages-1)}
              className="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 disabled:opacity-30 hover:bg-gray-100 dark:hover:bg-gray-700">»</button>
          </div>
        </div>
      )}
    </Card>
  );
}

// ===================== EMPTY STATE =====================
function EmptyState(){
  return(
    <div className="text-center py-16">
      <div className="text-gray-400 dark:text-gray-600 mb-3">
        <svg className="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <p className="text-gray-500 dark:text-gray-400 font-medium">Sin resultados</p>
      <p className="text-gray-400 dark:text-gray-500 text-sm mt-1">Los filtros actuales no devuelven datos. Intenta ajustarlos.</p>
    </div>
  );
}

// ===================== MAIN APP =====================
// ===================== VERCEL API CONFIG =====================
const VERCEL_API='https://dashboard-flota-nad7caud6-uhernandez2497-sources-projects.vercel.app/api/trigger-update';
const GITHUB_PAGES_DATA='https://uhernandez2497-source.github.io/dashboard-flota/data.json';

function App(){
  const [rawData,setRawData]=useState(null);
  const [fileName,setFileName]=useState('');
  const [darkMode,setDarkMode]=useState(true);
  const [loading,setLoading]=useState(true);
  const [updating,setUpdating]=useState(false);
  const [updateMsg,setUpdateMsg]=useState('');
  const [filters,setFilters]=useState({
    dateStart:null,dateEnd:null,
    zonaCliente:[],taller:[],clasificacion:[],tipoServicio:[],marca:[],tipoEquipo:[],
    searchText:''
  });

  // Auto-load: try GitHub Pages first, then local data.js as fallback
  useEffect(()=>{
    async function loadData(){
      setLoading(true);
      // 1) Try GitHub Pages (always latest)
      try{
        const res=await fetch(GITHUB_PAGES_DATA+'?t='+Date.now());
        if(res.ok){
          const json=await res.json();
          const data=(json.data||[]).map(normalizeRow).filter(r=>r.equipo||r.orden);
          if(data.length>0){
            setRawData(data);
            setFileName(`En vivo — ${data.length} registros — Actualizado: ${(json.updated||'').substring(0,16)}`);
            setLoading(false);
            return;
          }
        }
      }catch(e){console.log('GitHub Pages no disponible, usando datos locales');}
      // 2) Fallback: local data.js
      if(window.__FLEET_DATA__&&window.__FLEET_DATA__.data){
        const d=window.__FLEET_DATA__;
        const data=d.data.map(normalizeRow).filter(r=>r.equipo||r.orden);
        setRawData(data);
        setFileName(`Local — ${data.length} registros — ${(d.updated||'').substring(0,16)}`);
      }
      setLoading(false);
    }
    loadData();
  },[]);

  // Trigger update from OneDrive via Vercel API
  const triggerUpdate=async()=>{
    setUpdating(true);setUpdateMsg('Solicitando actualización...');
    try{
      const res=await fetch(VERCEL_API,{method:'POST'});
      if(!res.ok) throw new Error('Error '+res.status);
      setUpdateMsg('Descargando datos de OneDrive... (45s)');
      // Wait for GitHub Actions to finish
      await new Promise(r=>setTimeout(r,50000));
      setUpdateMsg('Recargando datos...');
      // Fetch updated data
      const dataRes=await fetch(GITHUB_PAGES_DATA+'?t='+Date.now());
      if(dataRes.ok){
        const json=await dataRes.json();
        const data=(json.data||[]).map(normalizeRow).filter(r=>r.equipo||r.orden);
        setRawData(data);
        setFileName(`En vivo — ${data.length} registros — Actualizado: ${(json.updated||'').substring(0,16)}`);
        setUpdateMsg('Datos actualizados correctamente');
      }else{
        setUpdateMsg('Actualización enviada. Recarga en 1 minuto.');
      }
    }catch(e){setUpdateMsg('Error: '+e.message);}
    setTimeout(()=>setUpdateMsg(''),5000);
    setUpdating(false);
  };

  // Apply dark mode class on <html> so all dark: variants work
  useEffect(()=>{
    if(darkMode){
      document.documentElement.classList.add('dark');
    }else{
      document.documentElement.classList.remove('dark');
    }
  },[darkMode]);

  // Get unique values for filters
  const filterOptions=useMemo(()=>{
    if(!rawData) return {};
    return{
      zonaCliente:unique(rawData,'zonaCliente'),
      taller:unique(rawData,'tallerOrden'),
      clasificacion:unique(rawData,'clasificacion'),
      tipoServicio:unique(rawData,'tipoServicio'),
      marca:unique(rawData,'marca'),
      tipoEquipo:unique(rawData,'tipoEquipo'),
    };
  },[rawData]);

  // Dynamic taller based on selected zona
  const tallerOptions=useMemo(()=>{
    if(!rawData) return[];
    if(filters.zonaCliente.length===0) return filterOptions.taller||[];
    return unique(rawData.filter(r=>filters.zonaCliente.includes(r.zonaCliente)),'tallerOrden');
  },[rawData,filters.zonaCliente,filterOptions.taller]);

  // Debounce filters so charts don't re-render on every click
  const debouncedFilters=useDebounce(filters,300);

  // Apply filters (uses debounced version for smooth performance)
  const filteredData=useMemo(()=>{
    if(!rawData) return[];
    const f=debouncedFilters;
    return rawData.filter(r=>{
      if(f.dateStart&&r.fechaIngreso&&r.fechaIngreso<f.dateStart) return false;
      if(f.dateEnd){
        const end=new Date(f.dateEnd);end.setHours(23,59,59);
        if(r.fechaIngreso&&r.fechaIngreso>end) return false;
      }
      if(f.zonaCliente.length&&!f.zonaCliente.includes(r.zonaCliente)) return false;
      if(f.taller.length&&!f.taller.includes(r.tallerOrden)) return false;
      if(f.clasificacion.length&&!f.clasificacion.includes(r.clasificacion)) return false;
      if(f.tipoServicio.length&&!f.tipoServicio.includes(r.tipoServicio)) return false;
      if(f.marca.length&&!f.marca.includes(r.marca)) return false;
      if(f.tipoEquipo.length&&!f.tipoEquipo.includes(r.tipoEquipo)) return false;
      if(f.searchText){
        const s=f.searchText.toLowerCase();
        if(!(r.orden||'').toLowerCase().includes(s)&&
           !(r.equipo||'').toLowerCase().includes(s)&&
           !(r.cliente||'').toLowerCase().includes(s)&&
           !(r.operador||'').toLowerCase().includes(s)) return false;
      }
      return true;
    });
  },[rawData,debouncedFilters]);

  const clearFilters=()=>setFilters({dateStart:null,dateEnd:null,zonaCliente:[],taller:[],clasificacion:[],tipoServicio:[],marca:[],tipoEquipo:[],searchText:''});

  // Chart click filter handler (stable ref to avoid re-renders)
  const handleChartFilter=useCallback((type,value)=>{
    setFilters(f=>{
      const key=type==='taller'?'taller':type;
      const arr=f[key]||[];
      if(arr.includes(value)) return{...f,[key]:arr.filter(x=>x!==value)};
      return{...f,[key]:[...arr,value]};
    });
  },[]);

  const activeFilters=Object.values(filters).filter(v=>Array.isArray(v)?v.length>0:v).length;

  if(loading) return(
    <div className="dark">
      <div className="min-h-screen bg-gray-900 flex items-center justify-center">
        <div className="text-center">
          <div className="w-12 h-12 border-3 border-gray-600 border-t-blue-500 rounded-full spinner mx-auto mb-3" style={{borderWidth:3}}></div>
          <p className="text-white text-sm">Cargando datos en vivo...</p>
          <p className="text-gray-500 text-xs mt-1">Conectando con GitHub Pages</p>
        </div>
      </div>
    </div>
  );

  if(!rawData) return <UploadScreen onDataLoad={(data,name)=>{setRawData(data);setFileName(name);}}/>;

  return(
    <div className={`min-h-screen transition-colors duration-300 ${darkMode?'bg-gray-900 text-gray-100':'bg-gray-100 text-gray-900'}`}>
      {/* HEADER */}
      <header className="bg-gradient-to-r from-[#0D3B6F] via-[#185FA5] to-[#1a6fba] px-4 py-3 sticky top-0 z-50 shadow-lg">
        <div className="max-w-[1600px] mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 bg-white/10 rounded-lg flex items-center justify-center">
              <Icons.truck/>
            </div>
            <div>
              <h1 className="text-white font-bold text-base">Dashboard de Flota</h1>
              <p className="text-white/60 text-[10px]">{fileName}</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <span className="text-white/60 text-[10px] hidden sm:inline">{filteredData.length} de {rawData.length} registros</span>
            {updateMsg&&<span className="text-yellow-300 text-[10px] hidden sm:inline">{updateMsg}</span>}
            <button onClick={triggerUpdate} disabled={updating}
              className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-white text-xs font-medium transition-colors ${updating?'bg-yellow-600 cursor-wait':'bg-green-600 hover:bg-green-700'}`}>
              <svg className={`w-3.5 h-3.5 ${updating?'spinner':''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              {updating?'Actualizando...':'Actualizar'}
            </button>
            <button onClick={()=>setDarkMode(d=>!d)}
              className="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors" title={darkMode?'Modo claro':'Modo oscuro'}>
              {darkMode?<Icons.sun/>:<Icons.moon/>}
            </button>
            <button onClick={()=>{setRawData(null);setFileName('');clearFilters();}}
              className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-medium transition-colors">
              Cargar Archivo
            </button>
          </div>
        </div>
      </header>

      {/* FILTER BAR */}
      <div className="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-2 shadow-sm sticky top-[52px] z-40">
        <div className="max-w-[1600px] mx-auto flex items-center gap-2 flex-wrap">
          <span className="text-gray-400"><Icons.filter/></span>

          {/* Date filters */}
          <div className="flex items-center gap-1">
            <span className="text-[10px] font-bold text-gray-500 uppercase">Desde:</span>
            <input type="date" value={filters.dateStart?filters.dateStart.toISOString().split('T')[0]:''}
              onChange={e=>setFilters(f=>({...f,dateStart:e.target.value?new Date(e.target.value):null}))}
              className="px-2 py-1 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500"/>
          </div>
          <div className="flex items-center gap-1">
            <span className="text-[10px] font-bold text-gray-500 uppercase">Hasta:</span>
            <input type="date" value={filters.dateEnd?filters.dateEnd.toISOString().split('T')[0]:''}
              onChange={e=>setFilters(f=>({...f,dateEnd:e.target.value?new Date(e.target.value):null}))}
              className="px-2 py-1 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500"/>
          </div>

          <div className="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1"></div>

          <MultiSelect label="Zona" options={filterOptions.zonaCliente||[]} selected={filters.zonaCliente}
            onChange={v=>setFilters(f=>({...f,zonaCliente:v}))}/>
          <MultiSelect label="Taller" options={tallerOptions} selected={filters.taller}
            onChange={v=>setFilters(f=>({...f,taller:v}))}/>
          <MultiSelect label="Clasificación" options={filterOptions.clasificacion||[]} selected={filters.clasificacion}
            onChange={v=>setFilters(f=>({...f,clasificacion:v}))}/>
          <MultiSelect label="Tipo Servicio" options={filterOptions.tipoServicio||[]} selected={filters.tipoServicio}
            onChange={v=>setFilters(f=>({...f,tipoServicio:v}))}/>
          <MultiSelect label="Marca" options={filterOptions.marca||[]} selected={filters.marca}
            onChange={v=>setFilters(f=>({...f,marca:v}))}/>
          <MultiSelect label="Tipo Equipo" options={filterOptions.tipoEquipo||[]} selected={filters.tipoEquipo}
            onChange={v=>setFilters(f=>({...f,tipoEquipo:v}))}/>

          <div className="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1"></div>

          {/* Search */}
          <div className="relative">
            <span className="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400"><Icons.search/></span>
            <input value={filters.searchText} onChange={e=>setFilters(f=>({...f,searchText:e.target.value}))}
              placeholder="Buscar equipo/orden..."
              className="pl-7 pr-2 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-xs w-40 focus:outline-none focus:ring-1 focus:ring-blue-500"/>
          </div>

          {activeFilters>0&&(
            <button onClick={clearFilters}
              className="flex items-center gap-1 px-3 py-1.5 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg text-xs font-semibold hover:bg-red-200 dark:hover:bg-red-900/50 transition-colors">
              <Icons.x/> Limpiar ({activeFilters})
            </button>
          )}
        </div>
      </div>

      {/* MAIN CONTENT */}
      <main className="max-w-[1600px] mx-auto p-4 space-y-6">
        {filteredData.length===0?<EmptyState/>:(
          <>
            {/* Alerts */}
            <AlertsPanel data={filteredData}/>

            {/* KPIs */}
            <KPISection data={filteredData}/>

            {/* Section 2: Costs */}
            <LazyChart height={400}>
              <Section title="Análisis de Costos" cols="grid-cols-1 lg:grid-cols-2">
                <CostBreakdown data={filteredData}/>
                <CostByZone data={filteredData} onFilter={handleChartFilter}/>
                <TopTalleres data={filteredData} onFilter={handleChartFilter}/>
              </Section>
            </LazyChart>

            {/* Section 3: Classification */}
            <LazyChart height={400}>
              <Section title="Análisis Correctivo vs Preventivo" cols="grid-cols-1 lg:grid-cols-2">
                <ClassificationDonut data={filteredData}/>
                <ServiceTypeChart data={filteredData}/>
                <BrandCorrectiveTable data={filteredData}/>
              </Section>
            </LazyChart>

            {/* Section 4: Time & Efficiency */}
            <LazyChart height={400}>
              <Section title="Tiempos y Eficiencia" cols="grid-cols-1 lg:grid-cols-2">
                <DelayByRegion data={filteredData}/>
                <DaysVsCostScatter data={filteredData}/>
                <TallerPerformanceTable data={filteredData}/>
              </Section>
            </LazyChart>

            {/* Section 5: Fleet */}
            <LazyChart height={400}>
              <Section title="Análisis de Flota" cols="grid-cols-1 lg:grid-cols-2">
                <OrdersByBrand data={filteredData} onFilter={handleChartFilter}/>
                <OrdersByType data={filteredData}/>
                <KmsVsCorrectiveScatter data={filteredData}/>
              </Section>
            </LazyChart>

            {/* Section 6: Detail Table */}
            <LazyChart height={300}>
              <section className="fade-in">
                <h2 className="text-lg font-bold mb-3 text-gray-800 dark:text-gray-200">Tabla de Detalle</h2>
                <DetailTable data={filteredData}/>
              </section>
            </LazyChart>
          </>
        )}
      </main>

      {/* FOOTER */}
      <footer className="text-center py-6 text-xs text-gray-400 dark:text-gray-600">
        Dashboard de Flota Vehicular — {rawData.length} registros cargados
      </footer>
    </div>
  );
}

// ===================== RENDER =====================
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
