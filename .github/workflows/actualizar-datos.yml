name: Actualizar Datos del Dashboard

on:
  schedule:
    # Ejecutar cada hora para mantener datos actualizados
    - cron: '0 * * * *'

  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Llamar a Vercel API para actualizar datos
        run: |
          echo "🔄 Iniciando actualización via Vercel API..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://dashmantenimiento.vercel.app/api/trigger-update" \
            -H "Content-Type: application/json" \
            --max-time 90)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Vercel API devolvió $HTTP_CODE"
            exit 1
          fi

          COUNT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count',0))" 2>/dev/null || echo "?")
          echo "✅ Actualización completada: $COUNT registros"
